name: Bero Futbol Analiz Botu

on:
  schedule:
    - cron: '0 13 * * 1-4' # Pazartesi - Perşembe: Türkiye saatiyle 16:00
    - cron: '0 14 * * 5'   # Cuma: Türkiye saatiyle 17:00
    - cron: '0 6 * * 0,6'  # Cumartesi - Pazar: Türkiye saatiyle 09:00
  workflow_dispatch: # İstediğin zaman panelden manuel test etmen için

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests numpy scipy

      - name: Botu Çalıştır
        run: python analiz.py

      - name: Log Dosyalarını GitHub'a Kaydet
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "otomatik: günlük tahmin logları güncellendi"
          file_pattern: "*.json *.csv"
