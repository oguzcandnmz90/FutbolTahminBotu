name: Bero Futbol Analiz Botu v.2

on:
  schedule:
    - cron: '0 13 * * 1-4'   # Hafta içi 16:00 TSI (UTC 13:00)
    - cron: '0 14 * * 5'     # Cuma 17:00 TSI (UTC 14:00)
    - cron: '0 6 * * 6,0'    # Hafta sonu 09:00 TSI (UTC 06:00)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests numpy scipy

      - name: Botu Çalıştır
        run: python analiz.py

      - name: Değişiklikleri GitHub'a Otomatik Kaydet ve Gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "4189282+github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
          git add tahmin_gecmisi.json aylik_tahmin_raporu_*.csv
          git commit -m "otomatik: günlük tahmin logları güncellendi" || echo "Değişiklik yok"
          git push origin main
