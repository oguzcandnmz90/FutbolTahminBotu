name: Bero Futbol Analiz Botu

on:
  repository_dispatch:
    types: [run-bot]
  workflow_dispatch:

jobs:
  run-bot:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests numpy scipy

      - name: Botu Çalıştır
        run: python analiz.py

      - name: Değişiklikleri GitHub'a Otomatik Kaydet ve Gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "4189282+github-actions[bot]@users.noreply.github.com"
          git add tahmin_gecmisi.json aylik_tahmin_raporu_*.csv 2>/dev/null || true
          git commit -m "otomatik: günlük tahmin logları güncellendi" || echo "Değişiklik yok"
          git pull origin main --rebase || true
          git push origin main || echo "Push atlandı veya değişiklik yok"
